name: Publish to NuGet

# Runs ONLY when a GitHub Release is published (not on every push/PR).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # NuGet Trusted Publishing (OIDC) + push Admin image to GHCR.
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
    # Full history helps SourceLink / MinVer embed accurate commit and version metadata.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: ./.github/actions/verify

    # NuGet Trusted Publishing: exchange GitHub OIDC token for a temporary API key.
    # Policy on nuget.org must match GitHub Repository Owner/Repo (CacheOrchestrator/CacheOrchestrator)
    # and workflow file publish.yml. Prefer Environment empty unless this job sets environment: ...
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        # nuget.org profile username (not email / not GitHub org) — owns the packages on nuget.org
        user: amarinsek

    - name: Push packages and symbols to NuGet
      run: |
        # Temporary key from NuGet/login (valid ~1 hour, not stored in GitHub Secrets)
        dotnet nuget push ./.artifacts/release/packages/*.nupkg \
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
          -s https://api.nuget.org/v3/index.json \
          --skip-duplicate
        dotnet nuget push ./.artifacts/release/packages/*.snupkg \
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
          -s https://api.nuget.org/v3/index.json \
          --skip-duplicate

    # ── Admin Console container (GHCR) ─────────────────────────────────────
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata (Admin image)
      id: admin-meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/cacheorchestrator-admin-console
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

    - name: Build and push Admin image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/CacheOrchestrator.AdminConsole/Dockerfile
        push: true
        tags: ${{ steps.admin-meta.outputs.tags }}
        labels: ${{ steps.admin-meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.admin-meta.outputs.version }}
