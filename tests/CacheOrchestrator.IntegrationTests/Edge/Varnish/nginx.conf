server {
    listen 80;

    location = /health {
        default_type text/plain;
        return 200 "ready";
    }

    location = /item {
        default_type text/plain;
        add_header X-CacheOrchestrator-Edge-Cacheable "1" always;
        add_header X-CacheOrchestrator-Edge-Ttl "300" always;
        add_header X-CacheOrchestrator-Edge-Grace "30" always;
        add_header xkey "coe1-integration-item" always;
        return 200 "origin-item";
    }

    location = /domain-item {
        default_type text/plain;
        add_header X-CacheOrchestrator-Edge-Cacheable "1" always;
        add_header X-CacheOrchestrator-Edge-Ttl "300" always;
        add_header X-CacheOrchestrator-Edge-Grace "30" always;
        add_header xkey "coe1-e43e0ee1e1c945b9-cb280a0503bfd5cb961e08894c80907de4b195e27063fbb0263737af2916f14f" always;
        return 200 "origin-domain-item";
    }
}
